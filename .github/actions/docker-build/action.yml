name: 'Build Docker Image'
description: 'Builds a Docker image with IsaacSim and IsaacLab dependencies'

inputs:
  image-tag:
    description: 'Docker image tag to use'
    required: true
  isaacsim-base-image:
    description: 'IsaacSim base image'
    required: true
  isaacsim-version:
    description: 'IsaacSim version'
    required: true
  dockerfile-path:
    description: 'Path to Dockerfile'
    default: 'docker/Dockerfile.base'
    required: false
  context-path:
    description: 'Build context path'
    default: '.'
    required: false
  platform:
    description: 'Target platform for `docker buildx build --platform`.'
    default: 'linux/amd64'
    required: false
  cache-from:
    description: >
      Optional value for `docker buildx build --cache-from`. Typically a
      `type=registry,ref=<image>` for cross-host layer cache. Leave empty for
      pure local-only builds.
    default: ''
    required: false
  cache-to:
    description: >
      Optional value for `docker buildx build --cache-to`. Pairs with
      `cache-from` for registry-backed layer cache writes.
    default: ''
    required: false
  deps-hash:
    description: >
      Pre-computed deps-hash to use for the local deps-tag check. When empty,
      this action computes the hash itself via the `_lib/compute-deps-hash`
      action. Set by callers (e.g. `ecr-build-push-pull`) that already compute
      the hash for a registry-side check, to avoid recomputing here.
    default: ''
    required: false
  evict-stale-cache:
    description: >
      When 'true', evict `isaac-lab*:deps-*` tags older than 14 days at the
      end of the build to bound disk growth on long-lived self-hosted
      runners. Default 'false' — no implicit cleanup.
    default: 'false'
    required: false
  deps-cache-repositories:
    description: >
      Optional newline-separated registry repositories, without tags. On a local
      miss, try each deps-<hash> image in order (e.g. LAN peers before NGC).
      Failed pulls fall back to the next repository, then a local build.
    default: ''
    required: false
  deps-cache-publish-repositories:
    description: >
      Optional newline-separated repositories to publish the verified dependency
      image to. Explicit opt-in; a failed verification or push fails the action.
      Requires verify-test-path and registry write credentials.
    default: ''
    required: false
  deps-cache-timeout:
    description: 'Maximum seconds per registry pull or push, including Docker retries.'
    default: '600'
    required: false
  verify-test-path:
    description: >
      Host pytest path run with IMAGE_TAG set before tagging a fresh build or
      publishing any image. Required when publication is requested.
    default: ''
    required: false

outputs:
  cache-source:
    description: 'local-exact, local-deps, registry repository, or build'
    value: ${{ steps.source.outputs.source }}

runs:
  using: composite
  steps:

    ##### 1: Setup docker config + login to nvcr.io (optional) #####

    - name: Setup docker config and login to nvcr.io
      uses: ./.github/actions/_lib/setup-docker-config
      with:
        base-image-ref: ${{ inputs.isaacsim-base-image }}:${{ inputs.isaacsim-version }}

    ##### 2: Host disk snapshot (pre) #####

    - name: Host disk snapshot (pre)
      shell: bash
      run: |
        set +e
        docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo "/var/lib/docker")
        deps_count=$(docker images --filter 'reference=isaac-lab*:deps-*' -q 2>/dev/null | wc -l)
        commit_count=$(docker images --filter 'reference=isaac-lab*' -q 2>/dev/null | wc -l)
        {
          echo "## Disk snapshot (pre)"
          echo '```'
          echo "Filesystem:"
          df -h / "${docker_root}" 2>/dev/null | sort -u
          echo
          echo "docker system df:"
          docker system df
          echo
          echo "Tag counts:"
          echo "  isaac-lab* (commit + deps tags): ${commit_count}"
          echo "  isaac-lab*:deps-* (deps cache) :  ${deps_count}"
          echo
          echo "Deps tags (newest first):"
          docker images --filter 'reference=isaac-lab*:deps-*' \
            --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}' 2>/dev/null \
            | head -20
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    ##### 3: Local exact-tag short-circuit #####

    - name: Check image locally
      id: local
      shell: bash
      run: |
        if docker image inspect "${{ inputs.image-tag }}" >/dev/null 2>&1; then
          echo "🟢 Image already in local docker store: ${{ inputs.image-tag }}"
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "🔵 Image not present locally, will check deps-cache / build"
        fi

    - name: Validate dependency-cache publication
      if: inputs.deps-cache-publish-repositories != '' && inputs.verify-test-path == ''
      shell: bash
      run: |
        echo "::error::Dependency-cache publication requires verify-test-path."
        exit 1

    ##### 4: Local deps-tag short-circuit #####

    - name: Compute deps hash
      id: deps-hash
      if: >
        inputs.deps-hash == '' &&
        (steps.local.outputs.hit != 'true' || inputs.deps-cache-publish-repositories != '')
      uses: ./.github/actions/_lib/compute-deps-hash
      with:
        dockerfile-path: ${{ inputs.dockerfile-path }}
        isaacsim-base-image: ${{ inputs.isaacsim-base-image }}
        isaacsim-version: ${{ inputs.isaacsim-version }}
        platform: ${{ inputs.platform }}

    - name: Check deps-tag locally
      id: local-deps
      if: steps.local.outputs.hit != 'true'
      shell: bash
      run: |
        DEPS_HASH="${{ inputs.deps-hash || steps.deps-hash.outputs.hash }}"
        LOCAL_DEPS_TAG="$(echo "${{ inputs.image-tag }}" | cut -d: -f1):deps-${DEPS_HASH}"

        echo "🔵 Local deps tag: ${LOCAL_DEPS_TAG}"
        echo "LOCAL_DEPS_TAG=${LOCAL_DEPS_TAG}" >> "$GITHUB_ENV"

        if docker image inspect "${LOCAL_DEPS_TAG}" >/dev/null 2>&1; then
          echo "🟢 Local deps-cache HIT! Retagging as ${{ inputs.image-tag }}"
          docker tag "${LOCAL_DEPS_TAG}" "${{ inputs.image-tag }}"
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "🟠 Local deps-cache MISS (will build then tag for future hits)"
        fi

    - name: Pull dependency image from peers or registry
      id: remote-deps
      if: >
        steps.local.outputs.hit != 'true' && steps.local-deps.outputs.hit != 'true' &&
        inputs.deps-cache-repositories != ''
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        DEPS_HASH: ${{ inputs.deps-hash || steps.deps-hash.outputs.hash }}
        TARGET_PLATFORM: ${{ inputs.platform }}
        CACHE_REPOSITORIES: ${{ inputs.deps-cache-repositories }}
        CACHE_TIMEOUT: ${{ inputs.deps-cache-timeout }}
      run: bash "${{ github.action_path }}/deps_image_cache.sh" pull

    ##### 5: Full build #####

    - name: Build image
      id: build
      if: >
        steps.local.outputs.hit != 'true' &&
        steps.local-deps.outputs.hit != 'true' &&
        steps.remote-deps.outputs.hit != 'true'
      shell: bash
      run: |
        BUILD_ARGS=(
          --progress=plain
          --platform "${{ inputs.platform }}"
          -f "${{ inputs.dockerfile-path }}"
          --build-arg "ISAACSIM_BASE_IMAGE_ARG=${{ inputs.isaacsim-base-image }}"
          --build-arg "ISAACSIM_VERSION_ARG=${{ inputs.isaacsim-version }}"
          --build-arg "ISAACSIM_ROOT_PATH_ARG=/isaac-sim"
          --build-arg "ISAACLAB_PATH_ARG=/workspace/isaaclab"
          --build-arg "DOCKER_USER_HOME_ARG=/root"
          -t "${{ inputs.image-tag }}"
        )
        if [ -n "${{ inputs.cache-from }}" ]; then
          BUILD_ARGS+=( --cache-from "${{ inputs.cache-from }}" )
        fi
        if [ -n "${{ inputs.cache-to }}" ]; then
          BUILD_ARGS+=( --cache-to "${{ inputs.cache-to }}" )
        fi

        BUILDER_NAME="docker-build-${{ github.run_id }}-${{ github.job }}"
        docker buildx create --use --driver docker-container --name "${BUILDER_NAME}" \
          || docker buildx use "${BUILDER_NAME}"
        trap 'docker buildx rm "${BUILDER_NAME}" || true' EXIT

        echo "🔵 Building ${{ inputs.image-tag }}..."
        docker buildx build --load "${BUILD_ARGS[@]}" "${{ inputs.context-path }}"
        echo "was-built=true" >> "$GITHUB_OUTPUT"

    ##### 6: Layer the CI pytest harness onto the built image #####

    # Kept out of the tracked Dockerfiles, which build local dev containers and
    # ship via publish-images.yaml. Only on a real build; cache hits have it.

    - name: Layer CI test dependencies
      if: steps.build.outputs.was-built == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Install as root, then restore the image's default user. Disable the
        # build-time cache so it cannot leave root-owned files in the runtime
        # user's uv cache when both users share HOME.
        image_user="$(docker image inspect --format '{{.Config.User}}' "${{ inputs.image-tag }}")"
        # Dockerfile on stdin (no context to stage). Quoted heredoc so the
        # shell leaves ISAACLAB_PATH and IMAGE_USER for Docker to expand; the
        # image tag is an action input, substituted before bash ever runs.
        docker build --platform "${{ inputs.platform }}" \
          --build-arg "IMAGE_USER=${image_user:-root}" \
          -t "${{ inputs.image-tag }}" - <<'DOCKERFILE'
        FROM ${{ inputs.image-tag }}
        ARG IMAGE_USER
        USER root
        RUN uv pip install --no-cache --python ${VIRTUAL_ENV}/bin/python \
              pytest pytest-mock junitparser flaky "coverage>=7.6.1"
        USER ${IMAGE_USER}
        DOCKERFILE

    - name: Verify image before caching or publication
      if: >
        inputs.verify-test-path != '' &&
        (steps.build.outputs.was-built == 'true' || inputs.deps-cache-publish-repositories != '')
      uses: ./.github/actions/_lib/verify-image
      with:
        image-tag: ${{ inputs.image-tag }}
        test-path: ${{ inputs.verify-test-path }}

    ##### 7: Retain built or pulled image with local deps-tag #####

    # Populate the deps-tag after a build or remote hit so the next run with
    # identical deps short-circuits locally at step 4.

    - name: Tag built image with local deps-tag
      if: steps.build.outputs.was-built == 'true' || steps.remote-deps.outputs.hit == 'true'
      shell: bash
      run: |
        if [ -n "${LOCAL_DEPS_TAG:-}" ]; then
          docker tag "${{ inputs.image-tag }}" "${LOCAL_DEPS_TAG}"
          echo "🟢 Tagged local deps-cache: ${LOCAL_DEPS_TAG}"
        else
          echo "🟠 LOCAL_DEPS_TAG not set, skipping local deps-cache tag"
        fi

    - name: Publish verified dependency image
      if: inputs.deps-cache-publish-repositories != ''
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        DEPS_HASH: ${{ inputs.deps-hash || steps.deps-hash.outputs.hash }}
        TARGET_PLATFORM: ${{ inputs.platform }}
        CACHE_REPOSITORIES: ${{ inputs.deps-cache-publish-repositories }}
        CACHE_TIMEOUT: ${{ inputs.deps-cache-timeout }}
      run: bash "${{ github.action_path }}/deps_image_cache.sh" push

    - name: Report image source
      id: source
      shell: bash
      env:
        LOCAL_HIT: ${{ steps.local.outputs.hit }}
        LOCAL_DEPS_HIT: ${{ steps.local-deps.outputs.hit }}
        REMOTE_SOURCE: ${{ steps.remote-deps.outputs.source }}
      run: |
        source="${REMOTE_SOURCE:-build}"
        if [ "${LOCAL_HIT}" = "true" ]; then
          source=local-exact
        elif [ "${LOCAL_DEPS_HIT}" = "true" ]; then
          source=local-deps
        fi
        echo "source=${source}" >> "$GITHUB_OUTPUT"
        echo "Dependency image source: ${source}" | tee -a "$GITHUB_STEP_SUMMARY"

    ##### 8: Evict stale local deps-cache tags (>14d) — opt-in #####

    - name: Evict stale local deps-cache tags (>14d)
      if: always() && inputs.evict-stale-cache == 'true'
      shell: bash
      run: |
        set +e
        TTL_DAYS=14
        cutoff=$(date -u -d "${TTL_DAYS} days ago" +%s)
        evicted=0
        while IFS='|' read -r created tag; do
          [ -z "$tag" ] && continue
          created_epoch=$(date -d "$created" +%s 2>/dev/null) || continue
          if [ "$created_epoch" -lt "$cutoff" ]; then
            days_old=$(( (cutoff - created_epoch) / 86400 + TTL_DAYS ))
            echo "🟠 Evicting deps tag (~${days_old}d old): ${tag}"
            docker rmi -f "$tag" >/dev/null 2>&1 || true
            evicted=$(( evicted + 1 ))
          fi
        done < <(docker images --filter 'reference=isaac-lab*:deps-*' \
          --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' 2>/dev/null)
        echo "🔵 Evicted ${evicted} deps tag(s) older than ${TTL_DAYS}d"

    ##### 9: Host disk snapshot (post) #####

    - name: Host disk snapshot (post)
      if: always()
      shell: bash
      run: |
        set +e
        docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo "/var/lib/docker")
        deps_count=$(docker images --filter 'reference=isaac-lab*:deps-*' -q 2>/dev/null | wc -l)
        commit_count=$(docker images --filter 'reference=isaac-lab*' -q 2>/dev/null | wc -l)
        {
          echo "## Disk snapshot (post)"
          echo '```'
          echo "Filesystem:"
          df -h / "${docker_root}" 2>/dev/null | sort -u
          echo
          echo "docker system df:"
          docker system df
          echo
          echo "Tag counts:"
          echo "  isaac-lab* (commit + deps tags): ${commit_count}"
          echo "  isaac-lab*:deps-* (deps cache) :  ${deps_count}"
          echo
          echo "Deps tags (newest first):"
          docker images --filter 'reference=isaac-lab*:deps-*' \
            --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}' 2>/dev/null \
            | head -20
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"
