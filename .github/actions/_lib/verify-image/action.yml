name: 'Verify Docker image'
description: 'Run host pytest image contracts before publishing a dependency image.'

inputs:
  image-tag:
    description: 'Locally available image to verify via IMAGE_TAG.'
    required: true
  test-path:
    description: 'Host pytest path that asserts contracts against IMAGE_TAG.'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        TEST_PATH: ${{ inputs.test-path }}
      run: |
        set -euo pipefail
        uv run --no-project --with pytest python -m pytest -q "${TEST_PATH}"
